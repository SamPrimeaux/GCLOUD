# Cloudflare Workers Configuration
name = "gcloudv3"
main = "src/index.js"
compatibility_date = "2025-11-17"

# Account ID
account_id = "ede6590ac0d2fb7daf155b35653457b2"

# Workers configuration
workers_dev = true

# Compatibility flags
compatibility_flags = ["nodejs_compat"]

# Environment variables
[vars]
APP_ENV = "production"
CLOUDFLARE_ACCOUNT_ID = "ede6590ac0d2fb7daf155b35653457b2"
SUPABASE_URL = "https://qmpghmthbhuumemnahcz.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_BQ3iz_92Jh8xvEiMg9WXpg_FNRpy2ZL"

# Migration to remove old Durable Objects
[[migrations]]
tag = "v1"
new_classes = []
deleted_classes = ["RealtimeServer", "TerminalSession"]

# R2 Buckets
[[r2_buckets]]
binding = "ALLINFRASTRUCTURE"
bucket_name = "allinfrastructure"

[[r2_buckets]]
binding = "APP_ASSETS"
bucket_name = "meauxlife-appkit"

[[r2_buckets]]
binding = "EMAIL_ARCHIVE"
bucket_name = "inneranimalmedia-email-archive"

[[r2_buckets]]
binding = "PERSONAL_BACKUP"
bucket_name = "samicloudbackups"

[[r2_buckets]]
binding = "R2_AUTORAG"
bucket_name = "autorag-meauxbility-chatbot"

[[r2_buckets]]
binding = "R2_DASHBOARD"
bucket_name = "meauxbility-dashboard"

# D1 Database
[[d1_databases]]
binding = "MEAUXOS_DB"
database_name = "meauxos"
database_id = "d8261777-9384-44f7-924d-c92247d55b46"

# Vectorize Index
[[vectorize]]
binding = "VECTORIZE"
index_name = "meauxos-knowledge-base"

